services:

  # ════════════════════════════════════════════════════════════════════════
  # PLATFORM — MySQL · MongoDB · Kafka · Eureka
  # ════════════════════════════════════════════════════════════════════════

  mysql:
    image: mysql:8.0
    container_name: casino-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: casino_db
      MYSQL_USER: casino_user
      MYSQL_PASSWORD: casino_pass
    volumes:
      - platform-mysql:/var/lib/mysql
      - ./platform/init-scripts/mysql:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    networks:
      - casino-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ucasino_user", "-pcasino_pass"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mongodb:
    image: mongo:6.0
    container_name: casino-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: casino_admin
      MONGO_INITDB_ROOT_PASSWORD: casino_secret
    volumes:
      - platform-mongodb:/data/db
    ports:
      - "27017:27017"
    networks:
      - casino-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 30s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: casino-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - platform-zookeeper:/var/lib/zookeeper
    networks:
      - casino-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: casino-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - platform-kafka:/var/lib/kafka/data
    ports:
      - "9092:9092"
    networks:
      - casino-net
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: casino-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic game-events   --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic wallet-events --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic user-events   --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic audit-events  --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic admin-events  --partitions 3 --replication-factor 1
      echo 'Topics creados.'
      "
    networks:
      - casino-net
    restart: "no"

  eureka:
    build:
      context: ./platform
      dockerfile: Dockerfile
    container_name: casino-eureka
    restart: unless-stopped
    ports:
      - "8761:8761"
    networks:
      - casino-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  # ════════════════════════════════════════════════════════════════════════
  # SERVICES — todos los microservicios en un contenedor
  # ════════════════════════════════════════════════════════════════════════

  services:
    build:
      context: .
      dockerfile: services/Dockerfile
    container_name: casino-services
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka:
        condition: service_healthy
    ports:
      - "8081:8081"  # auth-service
      - "8082:8082"  # wallet-service
      - "8083:8083"  # game-service
      - "8084:8084"  # audit-service
      - "8085:8085"  # admin-service
    environment:
      # MySQL — write side
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/casino_db
      SPRING_DATASOURCE_USERNAME: casino_user
      SPRING_DATASOURCE_PASSWORD: casino_pass
      DATABASE_URL: mysql+pymysql://casino_user:casino_pass@mysql:3306/casino_db
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: casino_user
      MYSQL_PASSWORD: casino_pass
      MYSQL_DATABASE: casino_db
      # MongoDB — read side
      SPRING_DATA_MONGODB_URI: mongodb://casino_admin:casino_secret@mongodb:27017/casino_db?authSource=admin
      MONGO_URI: mongodb://casino_admin:casino_secret@mongodb:27017/casino_db?authSource=admin
      MONGO_DATABASE: casino_db
      # Kafka
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Eureka
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      EUREKA_HOST: eureka
      EUREKA_PORT: 8761
      # Inter-servicio (dentro del mismo contenedor → localhost)
      WALLET_SERVICE_URL: http://localhost:8082
      AUDIT_SERVICE_URL: http://localhost:8084
      AUTH_SERVICE_URL: http://localhost:8081
      # Seguridad
      JWT_SECRET: casino_jwt_super_secret_key_2025_secure_32b
      PORT: 8083
      SPRING_KAFKA_CONSUMER_GROUP_ID: casino-consumer-group
    networks:
      - casino-net

  # ════════════════════════════════════════════════════════════════════════
  # FRONTEND
  # ════════════════════════════════════════════════════════════════════════

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: casino-frontend
    restart: unless-stopped
    depends_on:
      - services
    ports:
      - "3000:80"
    environment:
      VITE_AUTH_URL: http://localhost:8081
      VITE_WALLET_URL: http://localhost:8082
      VITE_GAME_URL: http://localhost:8083
      VITE_ADMIN_URL: http://localhost:8085
    networks:
      - casino-net

networks:
  casino-net:
    driver: bridge

volumes:
  platform-mysql:
  platform-mongodb:
  platform-kafka:
  platform-zookeeper:
