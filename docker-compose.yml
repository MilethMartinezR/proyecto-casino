version: "3.9"

# ============================================================
#  Casino Online — Docker Compose
#  Integrantes:
#    Mileth  → Java/Spring Boot + MongoDB  → auth-service, audit-service
#    Natalia → Python/FastAPI  + MySQL     → wallet-service, admin-service
#    Diego   → Node.js/Express + Redis     → game-service
#
#  Infraestructura compartida:
#    Eureka (service discovery), Kafka + Zookeeper (mensajería),
#    MongoDB, MySQL, Redis, Kafka UI
# ============================================================

networks:
  casino-net:
    driver: bridge

volumes:
  zookeeper-data:
  kafka-data:
  mongodb-data:
  mysql-data:
  redis-data:

services:

  # ──────────────────────────────────────────────
  #  EUREKA SERVER  — service discovery
  #  Todos los servicios se registran aquí
  # ──────────────────────────────────────────────
  eureka-server:
    image: steeltoeoss/eureka-server:latest
    container_name: casino-eureka
    restart: unless-stopped
    ports:
      - "8761:8761"
    networks:
      - casino-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  #  ZOOKEEPER  (requerido por Kafka)
  # ──────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: casino-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
    networks:
      - casino-net
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  #  KAFKA  — mensajería (auth, wallet, admin)
  # ──────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: casino-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - casino-net
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ──────────────────────────────────────────────
  #  KAFKA UI  — consola web (ver topics y mensajes)
  #  http://localhost:8090
  # ──────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: casino-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: casino-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - casino-net

  # ──────────────────────────────────────────────
  #  MONGODB  — auth-service + audit-service (Mileth)
  #  ⚠ Usar mongo:4.4 si corres en VirtualBox sin AVX
  # ──────────────────────────────────────────────
  mongodb:
    image: mongo:4.4
    container_name: casino-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: casino_admin
      MONGO_INITDB_ROOT_PASSWORD: casino_secret
      MONGO_INITDB_DATABASE: casino_db
    volumes:
      - mongodb-data:/data/db
    networks:
      - casino-net
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  #  MYSQL  — wallet-service + admin-service (Natalia)
  # ──────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: casino-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: casino_db
      MYSQL_USER: casino_user
      MYSQL_PASSWORD: casino_pass
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-scripts/mysql:/docker-entrypoint-initdb.d
    networks:
      - casino-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "casino_user", "-pcasino_pass"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  #  REDIS  — game-service (Diego)
  #  Estado de partidas e historial de Blackjack
  # ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: casino-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass redis_secret
    volumes:
      - redis-data:/data
    networks:
      - casino-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_secret", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  #  AUTH-SERVICE  — Puerto 8081
  #  Java · Spring Boot · MongoDB · Kafka producer
  #  Mileth
  # ──────────────────────────────────────────────
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    image: casino/auth-service:latest
    container_name: casino-auth-service
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATA_MONGODB_URI: mongodb://casino_admin:casino_secret@mongodb:27017/casino_db?authSource=admin
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: casino_jwt_super_secret_2025
    networks:
      - casino-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/auth/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ──────────────────────────────────────────────
  #  AUDIT-SERVICE  — Puerto 8084
  #  Java · Spring Boot · MongoDB · Kafka consumer
  #  Mileth  ⏳ pendiente
  # ──────────────────────────────────────────────
  audit-service:
    build:
      context: ./audit-service
      dockerfile: Dockerfile
    image: casino/audit-service:latest
    container_name: casino-audit-service
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
      SPRING_DATA_MONGODB_URI: mongodb://casino_admin:casino_secret@mongodb:27017/casino_db?authSource=admin
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_CONSUMER_GROUP_ID: audit-consumer-group
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: casino_jwt_super_secret_2025
    networks:
      - casino-net

  # ──────────────────────────────────────────────
  #  WALLET-SERVICE  — Puerto 8082
  #  Python · FastAPI · MySQL · Kafka producer
  #  Natalia
  # ──────────────────────────────────────────────
  wallet-service:
    build:
      context: ./wallet-service
      dockerfile: Dockerfile
    image: casino/wallet-service:latest
    container_name: casino-wallet-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      DATABASE_URL: mysql+pymysql://casino_user:casino_pass@mysql:3306/casino_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: casino_jwt_super_secret_2025
      PORT: 8082
    networks:
      - casino-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/docs"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ──────────────────────────────────────────────
  #  ADMIN-SERVICE  — Puerto 8085
  #  Python · FastAPI · MySQL · Kafka producer
  #  Natalia
  # ──────────────────────────────────────────────
  admin-service:
    build:
      context: ./admin-service
      dockerfile: Dockerfile
    image: casino/admin-service:latest
    container_name: casino-admin-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    ports:
      - "8085:8085"
    environment:
      DATABASE_URL: mysql+pymysql://casino_user:casino_pass@mysql:3306/casino_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: casino_jwt_super_secret_2025
      PORT: 8085
    networks:
      - casino-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/docs"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ──────────────────────────────────────────────
  #  GAME-SERVICE  — Puerto 8083
  #  Node.js · Express · Redis · Kafka producer
  #  Diego
  # ──────────────────────────────────────────────
  game-service:
    build:
      context: ./game-service
      dockerfile: Dockerfile
    image: casino/game-service:latest
    container_name: casino-game-service
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      PORT: 8083
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis_secret
      EUREKA_HOST: eureka-server
      EUREKA_PORT: 8761
      JWT_SECRET: casino_jwt_super_secret_2025
      WALLET_SERVICE_URL: http://wallet-service:8082
      AUDIT_SERVICE_URL: http://audit-service:8084
    networks:
      - casino-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ──────────────────────────────────────────────
  #  FRONTEND  — Puerto 3000
  #  Diego  ⏳ pendiente
  # ──────────────────────────────────────────────
